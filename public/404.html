<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      const path = window.location.pathname;
      const repo = "/Portfolio";
      const normalized = path.startsWith(repo) ? path.slice(repo.length) || "/" : path || "/";
      const redirect = normalized === "/" ? "/Portfolio/" : `/Portfolio/?redirect=${encodeURIComponent(normalized)}`;
      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
